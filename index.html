<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Canlı Maç · Trendyol Süper Lig</title>
<meta name="description" content="Süper Lig'de dünün, bugünün ve yarının maçları. Canlı skorlar, sonuçlar ve fikstür.">
<meta name="theme-color" content="#0b0d12" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f6f5f1" media="(prefers-color-scheme: light)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='46' fill='%23e11d48'/%3E%3Ccircle cx='50' cy='50' r='16' fill='white'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css?v=5">
<script>
  (function () {
    var t = localStorage.getItem('theme');
    if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.dataset.theme = t;
  })();
</script>
</head>
<body>
<svg class="doodles" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="dp" width="360" height="360" patternUnits="userSpaceOnUse">
      <g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <!-- top: ball -->
        <g transform="translate(40 50) rotate(-15)"><circle cx="0" cy="0" r="22"/><path d="M0-9l9 7-3 11h-12l-3-11z"/><path d="M0-9v-13M9-2l13-4M6 9l8 12M-6 9l-8 12M-9-2l-13-4"/></g>
        <!-- boot -->
        <g transform="translate(200 40) rotate(8)"><path d="M0 0v-22h14c2 10 10 14 26 16 6 1 6 14 0 14H0z"/><path d="M6 18v6M18 18v6M30 18v6"/><path d="M14-22l4 8M22-18l4 6"/></g>
        <!-- whistle -->
        <g transform="translate(300 150) rotate(-10)"><circle cx="0" cy="8" r="14"/><path d="M12 2l26-8v12l-22 10"/><circle cx="0" cy="8" r="4"/><path d="M-6-8c0-8 12-8 12 0"/></g>
        <!-- trophy -->
        <g transform="translate(90 190)"><path d="M-14-26h28v16a14 14 0 0 1-28 0z"/><path d="M-14-22h-10c0 12 4 16 11 17M14-22h10c0 12-4 16-11 17"/><path d="M0 4v12M-10 16h20M-12 24h24"/></g>
        <!-- goal -->
        <g transform="translate(220 250)"><path d="M-34 24v-40h68v40"/><path d="M-34-16l-10-8h88l-10 8M-17-16v40M0-16v40M17-16v40M-34-4h68M-34 10h68"/></g>
        <!-- card -->
        <g transform="translate(330 300) rotate(14)"><rect x="-10" y="-15" width="20" height="30" rx="3"/></g>
        <g transform="translate(35 320) rotate(-8)"><rect x="-10" y="-15" width="20" height="30" rx="3"/><path d="M-4-6h8M-4 0h8"/></g>
        <!-- stars/sparks -->
        <path d="M150 140l3 8 8 3-8 3-3 8-3-8-8-3 8-3z"/>
        <path d="M310 40l2 6 6 2-6 2-2 6-2-6-6-2 6-2z"/>
        <circle cx="160" cy="320" r="4"/><circle cx="20" cy="150" r="3"/><circle cx="270" cy="340" r="3"/>
      </g>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#dp)"/>
</svg>
<header class="top">
  <div class="wrap bar">
    <div class="brand">
      <span class="dot" aria-hidden="true"></span>
      <div>
        <h1>Canlı Maç</h1>
        <p>Trendyol Süper Lig</p>
      </div>
    </div>
    <div class="actions">
    <button id="theme" class="icon-btn" aria-label="Temayı değiştir" title="Temayı değiştir">
      <svg class="i-sun" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="i-moon" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
    <button id="menuBtn" class="icon-btn" aria-label="Fikstür menüsü" aria-haspopup="dialog" aria-controls="menu" title="Haftalar">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
    </button>
    </div>
  </div>
</header>

<main class="wrap">
  <nav class="tabs" role="tablist" aria-label="Gün seçimi">
    <button role="tab" data-day="-1" aria-selected="false"><b>Dün</b><span></span></button>
    <button role="tab" data-day="0" aria-selected="true"><b>Bugün</b><span></span></button>
    <button role="tab" data-day="1" aria-selected="false"><b>Yarın</b><span></span></button>
  </nav>

  <div class="meta">
    <span id="status" class="status"></span>
    <button id="refresh" class="refresh" aria-label="Yenile"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg><span>Yenile</span></button>
  </div>

  <section id="list" class="grid" aria-live="polite"></section>
</main>

<footer class="foot" aria-hidden="true"></footer>

<div id="menu" class="sheet" hidden>
  <div class="backdrop" data-close></div>
  <aside class="panel" role="dialog" aria-modal="true" aria-labelledby="menuTitle">
    <div class="panel-head">
      <h2 id="menuTitle">Fikstür</h2>
      <button class="icon-btn" data-close aria-label="Kapat"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div id="current" class="current"></div>
    <div id="weeks" class="weeks" role="tablist" aria-label="Haftalar"></div>
    <div id="weekList" class="weeklist"></div>
  </aside>
</div>

<script src="app.js?v=5"></script>
</body>
</html>
